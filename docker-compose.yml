services:
  familyapp:
    image: familyapp:latest
    build: .
    container_name: familyapp
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:/app/data/familyapp.db
      APP_URL: ${APP_URL:-https://istiqamahly.site}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Web Push (prayer reminders). All read at runtime; the reminder ticker stays off if unset.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Optional: enables the /api/cron/prayer-reminders backstop route.
      CRON_SECRET: ${CRON_SECRET:-}
    volumes:
      - familyapp_data:/app/data

volumes:
  familyapp_data:
