services:
  familyapp:
    image: familyapp:latest
    build: .
    container_name: familyapp
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:/app/data/familyapp.db
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - familyapp_data:/app/data

volumes:
  familyapp_data:
