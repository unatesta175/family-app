name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.VPS_APP_DIR }}
            git fetch origin main
            git reset --hard origin/main

            # Written fresh on every deploy from GitHub secrets, never committed to the repo,
            # so docker compose's automatic .env loading picks up Google OAuth credentials
            # without them ever touching git history.
            printf 'GOOGLE_CLIENT_ID=%s\nGOOGLE_CLIENT_SECRET=%s\nVAPID_PUBLIC_KEY=%s\nVAPID_PRIVATE_KEY=%s\nVAPID_SUBJECT=%s\nCRON_SECRET=%s\n' \
              "${{ secrets.GOOGLE_CLIENT_ID }}" "${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              "${{ secrets.VAPID_PUBLIC_KEY }}" "${{ secrets.VAPID_PRIVATE_KEY }}" \
              "${{ secrets.VAPID_SUBJECT }}" "${{ secrets.CRON_SECRET }}" > .env

            # Snapshot the live sqlite file inside the persistent volume before any schema
            # change runs, in case anything needs to be rolled back by hand later. Safe to
            # skip on a first-ever deploy where the container doesn't exist yet.
            docker compose exec -T familyapp sh -c 'cp /app/data/familyapp.db "/app/data/familyapp.db.bak-$(date +%Y%m%d-%H%M%S)"' || true

            docker compose build
            docker compose up -d

            # Give the container a moment to boot and run its startup self-heal migration
            # (src/lib/db/migrate.ts) before touching the database further.
            sleep 5

            # One-off and idempotent: links the pre-existing ilyas/anis accounts to real user
            # rows so they can still log in under the new auth system. No-ops on every deploy
            # after the first, since it skips any username that already has a users row.
            docker compose exec -T familyapp node scripts/migrate-legacy-accounts.mjs /app/data/familyapp.db

            docker image prune -f
